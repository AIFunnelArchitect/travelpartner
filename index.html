<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripAdvisor-clone</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap"
        rel="stylesheet">

    <!-- My Stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome cdn -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">

</head>

<body class="container">
    <!-- Navbar -->
    <div class="navbar">
        <div class="navbar__logo">
            <h1>Tripadvisor</h1>
        </div>
        <div class="navbar__btn1">
            <i class="fa-regular fa-comment" style="color: rgb(0, 0, 0);"></i>
            <p>Plan with AI</p>
        </div>
        <div class="navbar__menu">
            <p>Discover</p>
            <p>Review</p>
            <p>More</p>
        </div>
        <div class="navbar__btn2">
            <button>Sign in</button>
        </div>
    </div>
    <!-- Section One -->
    <div class="sect-one">
        <div class="sec-one__title">
            <h1>Where to?</h1>
        </div>
        <div class="sec-one__cat">
            <div class="sec-one__cat1">
                <i class="fa-solid fa-magnifying-glass-location" style="color: rgb(0, 0, 0);"></i>
                <p>Search All</p>
            </div>

            <div class="sec-one__cat2">
                <i class="fa-regular fa-camera" style="color: rgb(0, 0, 0);"></i>
                <p>Things to Do</p>
            </div>

            <div class="sec-one__cat3">
                <i class="fa-solid fa-bed" style="color: rgb(0, 0, 0);"></i>
                <p>Hotels</p>
            </div>

            <div class="sec-one__cat4">
                <i class="fa-solid fa-utensils" style="color: rgb(0, 0, 0);"></i>
                <p>Search All</p>
            </div>



        </div>



    </div>
    <!-- SearchBox -->
    <div class="main-container">
        <div class="searchbox">
            <div class="searchbox-s1">
                <i class="fa-solid fa-magnifying-glass" style="color: rgb(0, 0, 0);"></i>
                <input type="text" placeholder="Places to go, things to do, hotels...">
            </div>
            <div class="searchbox-s1__btn">
                <button class="askai">Ask AI</button>
                <button class="search">Search</button>
            </div>
        </div>
    </div>
    <!-- Hero Section -->
    <div class="main-hero">
        <div class="hero-s1">
            <div class="hero-img">
                <img src="./images/travel2.jpg" alt="travel">
            </div>

            <div class="hero-content">
                <h1>Find things to do for everything you're into</h1>
                <p>Browse 400,000 experiences and book with us</p>
                <button>Book now</button>
            </div>
        </div>
    </div>

    <!-- Interest Card -->
    <div class="card">
        <div class="card-s1">
            <h1 class="card-s1__title">Find things to do by interest</h1>
            <p class="card-s1__desc">Whatever you're into, we’ve got it</p>
        </div>

        <div>

        </div>


    </div>



</body>

</html>
